name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run e2e flow smoke (installs freqtrade/lightgbm)"
        required: false
        default: "false"

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install httpx

      - name: Run API smoke script
        run: python scripts/smoke_test.py

      - name: Run pytest (API smoke)
        run: pytest -q tests/test_api_smoke.py tests/test_no_bom.py

  e2e-flow:
    name: e2e-flow-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (e2e)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install freqtrade lightgbm

      - name: Run pytest (e2e flow smoke)
        run: pytest -q tests/test_e2e_flow_smoke.py
