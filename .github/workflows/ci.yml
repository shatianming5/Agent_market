name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run e2e flow smoke (installs freqtrade/lightgbm)"
        required: false
        default: "false"

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -r server/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install httpx

      - name: Compile check (catch syntax errors + merge conflicts)
        run: |
          python -c "
          import ast, pathlib, sys
          errors = []
          for d in ['src', 'server']:
              for f in pathlib.Path(d).rglob('*.py'):
                  try: ast.parse(f.read_text())
                  except SyntaxError as e: errors.append(f'{f}: {e}')
          if errors:
              print('Syntax errors found:')
              for e in errors: print(f'  {e}')
              sys.exit(1)
          print('All .py files OK')
          "

      - name: Import smoke (core modules loadable)
        run: |
          python -c "from agent_market.strategy_miner import MinerConfig, MinerState, Phase"
          python -c "from agent_market.strategy_miner.phases import phase_strategy_gen, phase_backtest, phase_evaluation"
          python -c "from agent_market.backtest_results import build_backtest_summary"

      - name: Run API smoke script
        run: python scripts/smoke_test.py

      - name: Run pytest (extended smoke)
        run: |
          pytest -q \
            tests/test_api_smoke.py \
            tests/test_no_bom.py \
            tests/test_security_and_gates.py \
            tests/test_sandbox_exec.py \
            tests/test_workspace_core.py \
            tests/test_strategy_miner_runner.py \
            tests/test_strategy_miner_artifacts.py \
            tests/test_strategy_miner_phases.py \
            tests/test_backtest_results.py \
            tests/test_pipeline_leakage.py \
            tests/test_walkforward.py

  e2e-flow:
    name: e2e-flow-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps (e2e)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -r requirements-full.txt

      - name: Run pytest (e2e flow smoke)
        run: pytest -q tests/test_e2e_flow_smoke.py tests/test_flow_portfolio_step.py tests/test_portfolio_hrp.py
