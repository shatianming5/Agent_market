              - article [ref=e351]:
                - generic [ref=e352]:
                  - heading "skill-retrieval-mcp" [level=1] [ref=e353]
                  - 'link "Permalink: skill-retrieval-mcp" [ref=e354] [cursor=pointer]':
                    - /url: "#skill-retrieval-mcp"
                    - img [ref=e355]
                - blockquote [ref=e357]:
                  - paragraph [ref=e358]: Your agent doesn't need you to find the right skills. It needs to search 89K of them on its own.
                - paragraph [ref=e359]:
                  - text: An MCP server that gives AI agents on-demand access to
                  - strong [ref=e360]: 89K+ skills
                  - text: covering virtually every technical domain. The agent searches as it works — the same way you look up docs mid-task.
                - paragraph [ref=e361]:
                  - text: Works with
                  - strong [ref=e362]: Claude Code
                  - text: ","
                  - strong [ref=e363]: Codex CLI
                  - text: ","
                  - strong [ref=e364]: Gemini CLI
                  - text: ","
                  - strong [ref=e365]: Cursor
                  - text: ", and any MCP-compatible agent."
                - generic [ref=e366]:
                  - heading "The Problem" [level=2] [ref=e367]
                  - 'link "Permalink: The Problem" [ref=e368] [cursor=pointer]':
                    - /url: "#the-problem"
                    - img [ref=e369]
                - paragraph [ref=e371]: "You give your agent a skill — \"always use TDD,\" \"follow this API style\" — and it works. But manually installing skills doesn't scale:"
                - list [ref=e372]:
                  - listitem [ref=e373]:
                    - strong [ref=e374]: You don't know what exists.
                    - text: There are thousands of skills out there. You install the 10 you happen to find — everything else, the agent guesses.
                  - listitem [ref=e375]:
                    - strong [ref=e376]: You can't install what you can't name.
                    - text: Mid-task, the agent needs a skill for "OIDC-based PyPI publishing" — but you'd never think to install that in advance.
                  - listitem [ref=e377]:
                    - strong [ref=e378]:
                      - text: 89K skills can't live in
                      - code [ref=e379]: ~/.claude/skills/
                      - text: .
                    - text: Even with lazy loading, thousands of skill descriptions bloat the system prompt.
                - generic [ref=e380]:
                  - heading "The Fix" [level=2] [ref=e381]
                  - 'link "Permalink: The Fix" [ref=e382] [cursor=pointer]':
                    - /url: "#the-fix"
                    - img [ref=e383]
                - paragraph [ref=e385]:
                  - text: Don't install skills upfront.
                  - strong [ref=e386]: Search them at runtime.
                - generic [ref=e387]:
                  - code [ref=e389]: "You: \"Help me set up CI/CD for this Python project\" ─── Step 1: Agent searches ─────────────────────────────────────────── Agent: search_skills(\"github actions python CI pipeline\") ← 3ms → 5 results (summaries only, no full instructions): 1. \"github-actions-python\" (0.91) - CI/CD pipelines for Python with pytest and linting 2. \"github-actions-docker\" (0.72) - Docker build and push in GitHub Actions 3. \"gitlab-ci-python\" (0.68) - GitLab CI/CD for Python projects 4. \"circleci-python\" (0.61) - CircleCI configuration for Python 5. \"jenkins-pipeline\" (0.45) - Jenkins declarative pipelines ─── Step 2: Agent reads descriptions, picks #1 ────────────────────── Agent: get_skill(\"github-actions-python\") → gets full guide: step-by-step setup, matrix testing, caching, best practices → writes .github/workflows/ci.yml ─── Step 3: New need emerges mid-task ──────────────────────────────── Agent: # workflow needs PyPI publishing — search again with different query search_skills(\"pypi publish trusted publisher\") ← 2ms → \"pypi-trusted-publishing\" (0.87) - OIDC-based PyPI publishing without API keys → reads guide, adds publish step"
                  - button "Copy" [ref=e391] [cursor=pointer]:
                    - img [ref=e392]
                - paragraph [ref=e395]: "Key behaviors:"
                - list [ref=e396]:
                  - listitem [ref=e397]:
                    - strong [ref=e398]: Search returns summaries, not full instructions
                    - text: — the agent reads descriptions and scores to decide which skills are worth fetching. 5 results searched, 1 skill read → 80% token savings.
                  - listitem [ref=e399]:
                    - strong [ref=e400]: The agent searches multiple times
                    - text: as the task evolves. Different phase → different query → different skill.
                  - listitem [ref=e401]:
                    - strong [ref=e402]: Queries are shaped by context.
                    - text: The second search includes "trusted publisher" — a term the agent picked up while working, not something the user said.
                - paragraph [ref=e403]: 89K skills. < 5ms search. Zero LLM calls. Runs locally.
                - table [ref=e405]:
                  - rowgroup [ref=e406]:
                    - row "Installing skills manually skill-retrieval-mcp" [ref=e407]:
