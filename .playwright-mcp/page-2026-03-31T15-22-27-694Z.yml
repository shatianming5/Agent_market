                      - cell "Edit YAML configs" [ref=e490]
                      - cell "Just talk" [ref=e491]
                    - row "Read docs to learn the framework CC already knows how" [ref=e492]:
                      - cell "Read docs to learn the framework" [ref=e493]
                      - cell "CC already knows how" [ref=e494]
                    - row "SSH in to debug when things break CC diagnoses and fixes automatically" [ref=e495]:
                      - cell "SSH in to debug when things break" [ref=e496]
                      - cell "CC diagnoses and fixes automatically" [ref=e497]
                    - row "Monitor scripts manually CC watches for risks proactively" [ref=e498]:
                      - cell "Monitor scripts manually" [ref=e499]
                      - cell "CC watches for risks proactively" [ref=e500]
                    - row "Restart from scratch on failure CC retries, hotfixes, resumes" [ref=e501]:
                      - cell "Restart from scratch on failure" [ref=e502]
                      - cell "CC retries, hotfixes, resumes" [ref=e503]
                - paragraph [ref=e504]:
                  - strong [ref=e505]: Key advantage
                  - text: ": You command one local Claude Code, which commands multiple Claude Code instances on the server — and actively monitors, diagnoses, and hotfixes along the way."
                - generic [ref=e506]:
                  - heading "Self-Evolving Pipeline" [level=2] [ref=e507]
                  - 'link "Permalink: Self-Evolving Pipeline" [ref=e508] [cursor=pointer]':
                    - /url: "#self-evolving-pipeline"
                    - img [ref=e509]
                - paragraph [ref=e511]: InfiEpisteme improves itself through natural language — no RL, no retraining, just updated instructions.
                - generic [ref=e512]:
                  - code [ref=e514]: "Run pipeline │ ▼ Observe problems ◄─── \"S1 only found 21 citations, need 30\" │ ▼ Discuss with CC ◄─── \"The regex doesn't match 'et al.' format\" │ ▼ CC updates .md ◄─── S1_literature.md: \"Web Search is Source 1, not fallback\" │ state_guard.py: fix regex ▼ S2_ideation.md: \"speculative hypotheses must be questions\" Next run is better │ └──► repeat"
                  - button "Copy" [ref=e516] [cursor=pointer]:
                    - img [ref=e517]
                - paragraph [ref=e520]: "Every skill file is a natural language instruction. When something goes wrong, you tell CC what happened, and it rewrites the instruction to prevent the same mistake. Real examples from our first run:"
                - table [ref=e522]:
                  - rowgroup [ref=e523]:
                    - row "You said CC improved" [ref=e524]:
                      - columnheader "You said" [ref=e525]
                      - columnheader "CC improved" [ref=e526]
                  - rowgroup [ref=e527]:
                    - 'row "\"Why only 21 citations?\" S1: Web Search promoted to primary source; added \"run second pass if < 30\"" [ref=e528]':
                      - cell "\"Why only 21 citations?\"" [ref=e529]
                      - 'cell "S1: Web Search promoted to primary source; added \"run second pass if < 30\"" [ref=e530]'
                    - 'row "\"This hypothesis has no evidence\" S2: Added evidence_basis: speculative label requirement" [ref=e531]':
                      - cell "\"This hypothesis has no evidence\"" [ref=e532]
                      - 'cell "S2: Added evidence_basis: speculative label requirement" [ref=e533]':
                        - text: "S2: Added"
                        - code [ref=e534]: "evidence_basis: speculative"
                        - text: label requirement
                    - 'row "\"The node packed 6 training runs\" S2: Added \"one node = one training run\" rule" [ref=e535]':
                      - cell "\"The node packed 6 training runs\"" [ref=e536]
                      - 'cell "S2: Added \"one node = one training run\" rule" [ref=e537]'
                    - 'row "\"500M tokens is too much for preliminary\" S4: Added \"S4.1 uses 100-200M tokens\" limit" [ref=e538]':
                      - cell "\"500M tokens is too much for preliminary\"" [ref=e539]
                      - 'cell "S4: Added \"S4.1 uses 100-200M tokens\" limit" [ref=e540]'
