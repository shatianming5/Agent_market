                    - img [ref=e480]
                - table [ref=e483]:
                  - rowgroup [ref=e484]:
                    - row "Traditional InfiEpisteme" [ref=e485]:
                      - columnheader "Traditional" [ref=e486]
                      - columnheader "InfiEpisteme" [ref=e487]
