                      - cell "\"experiment_tree.json never updates\"" [ref=e542]
                      - 'cell "S4: Added \"set status to running BEFORE training\" step" [ref=e543]'
                    - row "\"Only one architecture isn't convincing\" Added Pythia arch support; redesigned S4.1 as cross-architecture screening" [ref=e544]:
                      - cell "\"Only one architecture isn't convincing\"" [ref=e545]
                      - cell "Added Pythia arch support; redesigned S4.1 as cross-architecture screening" [ref=e546]
                    - 'row "\"Training restarted and lost 2h of logs\" S4/common: Added \"never overwrite results, back up with timestamp\" rule" [ref=e547]':
                      - cell "\"Training restarted and lost 2h of logs\"" [ref=e548]
                      - 'cell "S4/common: Added \"never overwrite results, back up with timestamp\" rule" [ref=e549]'
                - paragraph [ref=e550]:
                  - strong [ref=e551]: The pipeline's instructions are its weights. Natural language is the gradient. Conversation is the training loop.
                - generic [ref=e552]:
                  - heading "Architecture" [level=2] [ref=e553]
                  - 'link "Permalink: Architecture" [ref=e554] [cursor=pointer]':
                    - /url: "#architecture"
                    - img [ref=e555]
                - generic [ref=e557]:
                  - code [ref=e559]: "┌─────────────────────────────────────────────────────────────────────────────┐ │ │ │ You: \"Study Attention Residuals, target NeurIPS 2026\" │ │ │ │ │ ▼ │ │ Local Claude Code (mission control — the only CC you talk to) │ │ │ │ │ ├─ Web search: finds paper, competing methods │ │ ├─ SSH: configures server, writes config.yaml │ │ │ │ │ │ ┌─ Per-stage execution loop ─────────────────────────────────────┐ │ │ │ │ │ │ │ │ │ ssh: claude -p \"skills/S{N}.md\" ──► skill execution │ │ │ │ │ ssh: state_guard.py verify ──► deterministic check │ │ │ │ │ ssh: claude -p \"skills/memory_sync\" ──► knowledge consolidate │ │ │ │ │ ssh: claude -p \"skills/judge.md\" ──► 3-layer quality gate │ │ │ │ │ Layer 1: deterministic checks │ │ │ │ │ Layer 2: content quality │ │ │ │ │ Layer 3: first-principles reasoning │ │ │ │ │ ssh: state_guard.py advance ──► next stage or retry │ │ │ │ │ │ │ │ │ │ [CHECKPOINT at P0, S2, S3?] ──► pause for human review │ │ │ │ │ Fixed checklist (targets known failure modes) │ │ │ │ │ + LLM adversarial brief (supplements) │ │ │ │ │ + Raw file access (fallback) │ │ │ │ │ ──► ./run.sh approve to continue │ │ │ │ │ │ │ │ │ └────────────────────────────────────────────────────────────────┘ │ │ │ │ │ ├─ Diagnoses failures, hotfixes, retries automatically │ │ ├─ Reports to you in plain language │ │ └─ Repeats for all stages ─── intervene anytime ◄── You │ │ │ └─────────────────────────────────────────────────────────────────────────────┘ GPU Server receives SSH commands. Each \"claude -p\" spawns an independent CC instance that reads skill instructions, does the work, writes files. Local CC checks results, decides next action."
                  - button "Copy" [ref=e561] [cursor=pointer]:
                    - img [ref=e562]
                - paragraph [ref=e565]:
                  - strong [ref=e566]:
                    - code [ref=e567]: run.sh
                    - text: is optional.
                  - text: "It automates the loop for unattended runs, but the real orchestrator is your local Claude Code. In practice, local CC provides better results because it can:"
                - list [ref=e568]:
                  - listitem [ref=e569]:
                    - strong [ref=e570]: Predict risks
