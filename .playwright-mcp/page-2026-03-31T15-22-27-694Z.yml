                - generic [ref=e456]:
                  - heading "InfiEpisteme" [level=1] [ref=e457]
                  - 'link "Permalink: InfiEpisteme" [ref=e458] [cursor=pointer]':
                    - /url: "#infiepisteme"
                    - img [ref=e459]
                - paragraph [ref=e461]:
                  - 'link "License: MIT" [ref=e462] [cursor=pointer]':
                    - /url: /JayCheng113/InfiEpisteme/blob/main/LICENSE
                    - 'img "License: MIT" [ref=e463]'
                - blockquote [ref=e464]:
                  - paragraph [ref=e465]:
                    - strong [ref=e466]: Talk to Claude Code. Get a research paper.
                - paragraph [ref=e467]: InfiEpisteme is an automated research pipeline that turns a research idea into a peer-review-quality paper, clean code, and organized results — all through natural language conversation with Claude Code.
                - paragraph [ref=e468]: No frameworks to learn. No scripts to memorize. Just describe what you want to study.
                - generic [ref=e469]:
                  - code [ref=e471]: "You: I want to study Kimi's Attention Residuals paper that just came out. Validate it on small LLMs and propose improvements. Target NeurIPS 2026. CC: [searches web, finds paper, identifies 5 competing methods] [sets up server, writes proposal, starts 9-stage pipeline] [pauses for your review at key decisions] [monitors, catches bugs, fixes them, keeps going] ...6 hours later... Pipeline complete. Paper: 12 pages, 36 citations, 6 experiments. → DELIVERY/paper.pdf"
                  - button "Copy" [ref=e473] [cursor=pointer]:
                    - img [ref=e474]
                - generic [ref=e477]:
                  - heading "Why InfiEpisteme?" [level=2] [ref=e478]
